<h1>디스코드 봇 이용약관</h1>

<h2>1. 서비스 목적</h2>
<p>본 봇은 디스코드 서버의 공지 및 안내를 제공하기 위해 운영됩니다.</p>

<h2>2. 이용 규칙</h2>
<p>이용자는 봇을 악용하거나 다른 이용자에게 피해를 주어서는 안 됩니다.</p>

<h2>3. 서비스 제한</h2>
<p>운영자는 서비스의 안정적인 운영을 위해 필요한 경우 기능을 제한할 수 있습니다.</p>

<h2>4. 문의</h2>
<p>문의는 봇 운영자에게 디스코드 메시지로 전달해 주세요.</p>
